# ==============================================================================
# NexusFin AI — Oracle Cloud Always Free ARM64 Production Overlay
#
# Runs backend services + Caddy TLS reverse proxy on an OCI VM.Standard.A1.Flex
# (4 OCPUs, 24 GB RAM) while the Angular UI deploys on Vercel.
#
# Usage:
#   docker compose --env-file .env.oci -f docker-compose.yml -f docker-compose.oci.yml up -d --build
# ==============================================================================

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: nexusfin-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN (e.g. api.<PUBLIC_IP>.sslip.io)}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?Set AUTH_DOMAIN (e.g. auth.<PUBLIC_IP>.sslip.io)}
    volumes:
      - ./infra/oci/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api-gateway
      - keycloak

  postgres-ledger:
    restart: unless-stopped
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.oci}

  postgres-vector:
    restart: unless-stopped
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.oci}

  postgres-keycloak:
    image: postgres:16-alpine
    container_name: nexusfin-postgres-keycloak
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.oci}
    volumes:
      - pg_keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  discovery-server:
    image: ${NEXUSFIN_IMAGE_REGISTRY:-nexusfin-ai}/discovery-server:${NEXUSFIN_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports: !reset []

  api-gateway:
    image: ${NEXUSFIN_IMAGE_REGISTRY:-nexusfin-ai}/api-gateway:${NEXUSFIN_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports: !reset []
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://${AUTH_DOMAIN}/realms/nexusfin
      NEXUSFIN_SECURITY_JWT_JWK_SET_URI: http://keycloak:8080/realms/nexusfin/protocol/openid-connect/certs
      NEXUSFIN_SECURITY_JWT_ADDITIONAL_ISSUERS: https://${AUTH_DOMAIN}/realms/nexusfin,http://keycloak:8080/realms/nexusfin
      NEXUSFIN_CORS_ALLOWED_ORIGIN_PATTERNS: ${NEXUSFIN_CORS_ALLOWED_ORIGIN_PATTERNS:-https://*.vercel.app}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"

  ledger-service:
    image: ${NEXUSFIN_IMAGE_REGISTRY:-nexusfin-ai}/ledger-service:${NEXUSFIN_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports: !reset []
    environment:
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.oci}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://${AUTH_DOMAIN}/realms/nexusfin
      NEXUSFIN_SECURITY_JWT_JWK_SET_URI: http://keycloak:8080/realms/nexusfin/protocol/openid-connect/certs
      NEXUSFIN_SECURITY_JWT_ADDITIONAL_ISSUERS: https://${AUTH_DOMAIN}/realms/nexusfin,http://keycloak:8080/realms/nexusfin
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"

  ai-fraud-service:
    image: ${NEXUSFIN_IMAGE_REGISTRY:-nexusfin-ai}/ai-fraud-service:${NEXUSFIN_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports: !reset []
    environment:
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.oci}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy-key}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"

  notification-service:
    image: ${NEXUSFIN_IMAGE_REGISTRY:-nexusfin-ai}/notification-service:${NEXUSFIN_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports: !reset []
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://${AUTH_DOMAIN}/realms/nexusfin
      NEXUSFIN_SECURITY_JWT_JWK_SET_URI: http://keycloak:8080/realms/nexusfin/protocol/openid-connect/certs
      NEXUSFIN_SECURITY_JWT_ADDITIONAL_ISSUERS: https://${AUTH_DOMAIN}/realms/nexusfin,http://keycloak:8080/realms/nexusfin
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"

  kafka:
    restart: unless-stopped
    ports: !reset []

  redis:
    restart: unless-stopped
    ports: !reset []

  keycloak:
    command: start --import-realm
    restart: unless-stopped
    ports: !reset []
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.oci}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set in .env.oci}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${AUTH_DOMAIN}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m"

  frontend:
    image: ${NEXUSFIN_IMAGE_REGISTRY:-nexusfin-ai}/frontend:${NEXUSFIN_IMAGE_TAG:-latest}
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  pg_keycloak_data:
