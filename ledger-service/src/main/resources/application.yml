server:
  port: 8081

spring:
  application:
    name: ledger-service
  threads:
    virtual:
      enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8083/realms/nexusfin}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexusfin_ledger}
    username: ${SPRING_DATASOURCE_USERNAME:nexusfin}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: NexusFinLedgerHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 500ms

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

nexusfin:
  redis:
    enabled: ${NEXUSFIN_REDIS_ENABLED:true}
    idempotency-ttl-seconds: ${NEXUSFIN_REDIS_IDEMPOTENCY_TTL:86400}
    balance-ttl-seconds: ${NEXUSFIN_REDIS_BALANCE_TTL:300}
    in-flight-lock-ttl-seconds: ${NEXUSFIN_REDIS_IN_FLIGHT_LOCK_TTL:60}
  kafka:
    outbox:
      enabled: ${NEXUSFIN_OUTBOX_ENABLED:true}
      poll-interval-ms: 1000
      batch-size: 50
      max-retries: 5
    topics:
      ledger-transactions: nexusfin.ledger.transactions

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    baggage:
      enabled: true
      remote-fields:
        - X-Correlation-Id
      correlation:
        enabled: true
        fields:
          - X-Correlation-Id
