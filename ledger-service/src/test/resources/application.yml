spring:
  application:
    name: ledger-service-test
  threads:
    virtual:
      enabled: true
  kafka:
    template:
      observation-enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.nexusfin.io/realms/nexusfin

  datasource:
    url: jdbc:h2:mem:ledger_test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  flyway:
    enabled: false

eureka:
  client:
    enabled: false

nexusfin:
  redis:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
    baggage:
      enabled: true
      remote-fields:
        - X-Correlation-Id
      correlation:
        enabled: true
        fields:
          - X-Correlation-Id
