spring:
  application:
    name: ledger-service-test
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:mem:ledger_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

eureka:
  client:
    enabled: false

nexusfin:
  kafka:
    outbox:
      enabled: false
