name: Release & Multi-Arch Container CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  verify-before-release:
    name: Gate Release on Backend & Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Tests & Package JARs
        env:
          SPRING_DATASOURCE_PASSWORD: nexusfin_ci_secret_password
          NEXUSFIN_API_KEY: nexusfin-ci-secret-key-2026
        run: |
          chmod +x mvnw
          ./mvnw clean verify --batch-mode

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Test & Build Angular Frontend
        working-directory: frontend
        run: |
          npm ci
          npm test -- --watch=false
          npm run build

      - name: Upload Packaged Service JARs
        uses: actions/upload-artifact@v4
        with:
          name: packaged-jars
          path: '*/target/*.jar'

  publish-multiarch-images:
    name: Build & Push ARM64/AMD64 Images to GHCR
    runs-on: ubuntu-latest
    needs: verify-before-release
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - api-gateway
          - ledger-service
          - ai-fraud-service
          - notification-service
          - frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Packaged JARs
        uses: actions/download-artifact@v4
        with:
          name: packaged-jars

      - name: Set up QEMU (for ARM64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize Lowercase Repository Path for GHCR
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Extract Image Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LC }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build & Push Multi-Arch Image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  create-release:
    name: Draft GitHub Release on Tag
    runs-on: ubuntu-latest
    needs: publish-multiarch-images
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
