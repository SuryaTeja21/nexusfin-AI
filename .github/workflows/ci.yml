name: NexusFin AI CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Verify Invariants
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v5

      - name: Set up Java 21 (Temurin LTS)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Compile and Run Unit Tests
        run: ./mvnw clean test --batch-mode

      - name: Generate JaCoCo Code Coverage Report
        run: ./mvnw jacoco:report --batch-mode
        continue-on-error: true

      - name: Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-test-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-coverage-report
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore

  docker-lint:
    name: Validate Docker Compose & Container Configurations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v5

      - name: Validate Docker Compose Configuration
        run: docker compose config
