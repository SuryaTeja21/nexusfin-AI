spring:
  application:
    name: ai-fraud-service-test
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:mem:fraud_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

  ai:
    openai:
      api-key: test-dummy-key

eureka:
  client:
    enabled: false

nexusfin:
  kafka:
    consumer:
      enabled: false
