spring:
  application:
    name: api-gateway-test
  reactor:
    context-propagation: auto
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.nexusfin.io/realms/nexusfin
  cloud:
    discovery:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: test-accounts-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/accounts/**
        - id: test-ledger-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/ledger/**
        - id: test-fraud-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/fraud/**

eureka:
  client:
    enabled: false
