spring:
  application:
    name: api-gateway-test
  cloud:
    discovery:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: test-accounts-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/accounts/**

eureka:
  client:
    enabled: false

nexusfin:
  security:
    enabled: true
    api-key: test-api-key-12345
