server:
  port: 8080

spring:
  application:
    name: api-gateway
  reactor:
    context-propagation: auto
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8083/realms/nexusfin}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Route: Core Ledger Service (ACID Ledger & Accounts)
        - id: ledger-service-accounts
          uri: lb://ledger-service
          predicates:
            - Path=/api/v1/accounts/**
          filters:
            - StripPrefix=0
            - name: Retry
              args:
                retries: 3
                methods:
                  - GET
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
            - name: CircuitBreaker
              args:
                name: ledgerCircuitBreaker
                fallbackUri: forward:/fallback/ledger

        - id: ledger-service-transactions
          uri: lb://ledger-service
          predicates:
            - Path=/api/v1/ledger/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: ledgerCircuitBreaker
                fallbackUri: forward:/fallback/ledger

        # Route: AI Fraud & Audit Service
        - id: ai-fraud-service
          uri: lb://ai-fraud-service
          predicates:
            - Path=/api/v1/fraud/**
          filters:
            - StripPrefix=0
            - name: Retry
              args:
                retries: 3
                methods:
                  - GET
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
            - name: CircuitBreaker
              args:
                name: fraudCircuitBreaker
                fallbackUri: forward:/fallback/fraud

        # Route: Real-Time WebSocket & STOMP Notifications Feed
        - id: notification-service-ws
          uri: lb:ws://notification-service
          predicates:
            - Path=/ws/**

        # Route: Angular SPA Frontend (Nginx)
        - id: frontend-ui
          uri: ${FRONTEND_URI:http://frontend:80}
          predicates:
            - Path=/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "${NEXUSFIN_CORS_ALLOWED_ORIGIN_PATTERNS:*}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    baggage:
      enabled: true
      remote-fields:
        - X-Correlation-Id
      correlation:
        enabled: true
        fields:
          - X-Correlation-Id

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      ledgerCircuitBreaker:
        base-config: default
      fraudCircuitBreaker:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 50
        max-wait-duration: 20ms
    instances:
      ledgerBulkhead:
        base-config: default
      fraudBulkhead:
        base-config: default
