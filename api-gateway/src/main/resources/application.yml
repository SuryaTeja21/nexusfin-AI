server:
  port: 8080

spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Route: Core Ledger Service (ACID Ledger & Accounts)
        - id: ledger-service-accounts
          uri: lb://ledger-service
          predicates:
            - Path=/api/v1/accounts/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: ledgerCircuitBreaker
                fallbackUri: forward:/fallback/ledger

        - id: ledger-service-transactions
          uri: lb://ledger-service
          predicates:
            - Path=/api/v1/ledger/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: ledgerCircuitBreaker
                fallbackUri: forward:/fallback/ledger

        # Route: AI Fraud & Audit Service
        - id: ai-fraud-service
          uri: lb://ai-fraud-service
          predicates:
            - Path=/api/v1/fraud/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: fraudCircuitBreaker
                fallbackUri: forward:/fallback/fraud

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      ledgerCircuitBreaker:
        base-config: default
      fraudCircuitBreaker:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 5s

nexusfin:
  security:
    enabled: ${NEXUSFIN_SECURITY_ENABLED:false}
    api-key: ${NEXUSFIN_API_KEY:nexusfin-prod-secret-key-2026}
